# fly.toml — Fly.io application configuration
# Deploy manually with: fly deploy

app = "kunstv"
primary_region = "ams"

[env]
  PORT = "8080"
  RUST_LOG = "info"
  DATABASE_URL = "sqlite:/data/mytv.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "mytv_data"
  destination = "/data"
  initial_size = "1gb"
