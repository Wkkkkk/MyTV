name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/progress/**"
      - "docs/architecture/architecture-diagram.html"
      - "scripts/progress_site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # delete stale run artifacts on retry (self-heal)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test build script
        run: python3 scripts/progress_site/build_test.py -v
      - name: Build site
        run: python3 scripts/progress_site/build.py
      - uses: actions/configure-pages@v5
      # Self-heal: when GitHub auto-retries the whole run (run_attempt > 1), the
      # "github-pages" artifact from the earlier attempt lingers, and
      # deploy-pages@v4 then aborts with "Multiple artifacts named github-pages
      # ... count is 2". Delete any stale copy for THIS run before uploading so
      # exactly one artifact exists. No-op on a normal first attempt.
      - name: Remove stale github-pages artifact from earlier attempts
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            for (const a of data.artifacts.filter((a) => a.name === "github-pages")) {
              core.info(`Deleting stale artifact ${a.id} (${a.name})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id,
              });
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Self-heal: GitHub Pages occasionally returns a transient
      # "Deployment failed, try again later." Retry once after a short pause
      # (this is exactly what a manual re-run does).
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before deploy retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
