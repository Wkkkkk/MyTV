name: Update yt-dlp

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  update:
    name: Check and bump yt-dlp
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Get latest yt-dlp version
        id: latest
        run: |
          VERSION=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -r '.info.version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get pinned yt-dlp version
        id: pinned
        run: |
          VERSION=$(grep -oP 'yt-dlp==\K[^\s]+' Dockerfile)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if update needed
        id: check
        env:
          LATEST: ${{ steps.latest.outputs.version }}
          PINNED: ${{ steps.pinned.outputs.version }}
        run: |
          if [ "$LATEST" = "$PINNED" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "yt-dlp is already at $PINNED, nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Update available: $PINNED -> $LATEST"
          fi

      - name: Update Dockerfile
        if: steps.check.outputs.needed == 'true'
        env:
          LATEST: ${{ steps.latest.outputs.version }}
          PINNED: ${{ steps.pinned.outputs.version }}
        run: |
          sed -i "s/yt-dlp==$PINNED/yt-dlp==$LATEST/" Dockerfile

      - name: Create branch and open PR
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.latest.outputs.version }}
          PINNED: ${{ steps.pinned.outputs.version }}
        run: |
          BRANCH="chore/bump-ytdlp-$LATEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Dockerfile
          git commit -m "chore: bump yt-dlp to $LATEST"
          git push origin "$BRANCH"
          BODY="Automated weekly update of the pinned yt-dlp version in the Dockerfile.

**Previous version:** \`$PINNED\`
**New version:** \`$LATEST\`

[yt-dlp changelog](https://github.com/yt-dlp/yt-dlp/releases)"
          gh pr create \
            --title "chore: bump yt-dlp to $LATEST" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"
