<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/app.css">
  <meta name="theme-color" content="#e94560">
  <title>MyTV</title>
  <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13"></script>
  <script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
    a{color:inherit;text-decoration:none}

    /* ── header ───────────────────────────────────────────────── */
    .site-header{background:var(--surface-1);padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
    .site-header h1{font-size:1.1rem;color:var(--accent);letter-spacing:1px}
    .site-nav{display:flex;gap:12px;font-size:0.85rem}
    .site-nav a{color:var(--text-muted)}

    /* ── player panel ─────────────────────────────────────────── */
    #player-panel{display:none;background:#000;border-bottom:2px solid var(--accent)}
    #player-panel video{width:100%;max-height:50vh;display:block}
    #player-error{display:none;padding:32px;text-align:center;color:var(--accent);background:#000;font-size:1rem}
    #player-ended{display:none;padding:32px;text-align:center;color:#fff;background:#000;font-size:1rem}
    #player-waiting{display:none;padding:32px;text-align:center;color:#fff;background:#000;font-size:1rem}
    #player-toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
      z-index:9;background:rgba(0,0,0,.85);color:#fff;padding:8px 14px;border-radius:6px;
      font-size:0.85rem;max-width:80%;text-align:center}
    #player-panel{position:relative}
    /* chrome reveal is gated on .show-controls (set by JS) */
    #player-toolbar{position:absolute;top:0;left:0;right:0;z-index:6;
      display:flex;align-items:center;gap:8px;padding:10px 12px;
      background:linear-gradient(#000,transparent);
      opacity:0;transition:opacity 0.2s;pointer-events:none}
    #player-panel.show-controls #player-toolbar{opacity:1;pointer-events:auto}
    #ov-title{color:#fff;font-size:0.85rem;font-weight:600;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ov-btn{min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;
      background:rgba(20,20,20,0.7);color:#eee;border:1px solid var(--border-strong);
      border-radius:4px;cursor:pointer;font-size:1rem;font-family:inherit}
    .ov-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
    .ov-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
    .ov-btn[hidden]{display:none}
    .ov-spacer{flex:1}
    #ov-center-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      z-index:6;width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
      background:rgba(255,255,255,0.92);color:#111;font-size:1.6rem;
      display:none;align-items:center;justify-content:center}
    #player-panel.show-controls #ov-center-play{display:flex}
    #player-transport{position:absolute;bottom:0;left:0;right:0;z-index:6;
      display:flex;align-items:center;gap:8px;padding:10px 12px;
      background:linear-gradient(transparent,#000);
      opacity:0;transition:opacity 0.2s;pointer-events:none}
    #player-panel.show-controls #player-transport{opacity:1;pointer-events:auto}
    #ov-seek{flex:1;height:4px;cursor:pointer;accent-color:var(--accent)}
    .ov-time{font-size:0.75rem;color:#ddd;font-variant-numeric:tabular-nums;flex-shrink:0}
    /* fullscreen: panel fills the screen so custom chrome stays visible */
    #player-panel:fullscreen{display:flex;align-items:center;justify-content:center;background:#000}
    #player-panel:fullscreen video{max-height:100vh;width:100%}
    #player-help{position:absolute;top:56px;right:12px;z-index:7;
      background:rgba(10,10,10,0.92);border:1px solid var(--border-strong);
      border-radius:5px;padding:10px 14px;font-size:0.8rem;color:var(--text);line-height:1.7}
    #player-help strong{display:block;margin-bottom:4px;color:var(--accent)}
    /* Visible whenever not [hidden] — like #player-help. NOT gated on
       show-controls, so the item list stays clickable without hovering. */
    #player-playlist{position:absolute;bottom:64px;right:12px;z-index:7;
      max-height:50vh;width:min(360px,80vw);overflow-y:auto;
      background:rgba(0,0,0,0.92);border:1px solid var(--border);border-radius:6px}
    .pl-row{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;
      line-height:1.4;border-bottom:1px solid var(--border-subtle)}
    .pl-row:hover{background:rgba(255,255,255,0.08)}
    .pl-row.current{background:var(--accent);color:#fff}
    .pl-mark{flex:0 0 14px;text-align:center}
    .pl-title{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pl-dur{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--text-muted)}
    .pl-row.current .pl-dur{color:#fff}
    .pl-row.unavailable{opacity:0.4;cursor:default}
    .pl-row.unavailable:hover{background:transparent}
    .pl-row.unavailable .pl-mark{color:var(--text-dim)}
    #player-buffering{display:none;position:absolute;top:0;left:0;right:0;bottom:0;z-index:5;
      align-items:center;justify-content:center;gap:10px;
      background:#000;color:#fff;font-size:0.95rem}
    #player-buffering.show{display:flex}
    .spinner-lg{width:22px;height:22px;border-radius:50%;
      border:3px solid #444;border-top-color:var(--accent);
      animation:spin 0.7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── player info bar ──────────────────────────────────────────── */
    #player-info{display:none;align-items:center;gap:10px;padding:8px 12px;
                 background:var(--surface-1);border-bottom:1px solid var(--border-subtle)}
    .pi-logo{width:28px;height:28px;border-radius:3px;flex-shrink:0;
             display:flex;align-items:center;justify-content:center;
             overflow:hidden;background:#222}
    .pi-logo img{width:100%;height:100%;object-fit:contain}
    .pi-logo span{color:#fff;font-size:13px;font-weight:700}
    .pi-meta{flex:1;min-width:0}
    .pi-name{display:block;color:#fff;font-size:0.85rem;font-weight:600;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pi-cat{display:block;color:var(--text-dim);font-size:0.75rem}
    .pi-live{background:var(--live);color:#fff;font-size:0.6rem;font-weight:700;
             padding:1px 5px;border-radius:2px;letter-spacing:0.5px;flex-shrink:0}
    .pi-pos{font-size:0.75rem;color:var(--text-dim);flex-shrink:0}

    /* ── epg nav (tabs + time nav) ────────────────────────────── */
    .epg-nav{display:flex;align-items:center;justify-content:space-between;
             flex-wrap:wrap;gap:8px;padding:8px 12px;background:var(--surface-nav);border-bottom:1px solid var(--border)}
    .time-nav{display:flex;align-items:center;gap:10px}
    .nav-btn{padding:3px 12px;background:var(--border);color:var(--text-muted);border:1px solid var(--border-strong);
             border-radius:3px;cursor:pointer;font-size:0.82rem;font-family:inherit;}
    .nav-btn:hover{background:var(--border-strong)}
    .time-range{font-size:0.8rem;color:var(--text-muted);min-width:120px;text-align:center}

    /* ── epg grid ─────────────────────────────────────────────── */
    .epg-wrapper{overflow-x:auto}
    .epg-grid{min-width:700px}
    .epg-row{display:flex;border-bottom:1px solid var(--border-subtle);min-height:44px}
    .channel-col{width:140px;flex-shrink:0;padding:0 10px;display:flex;align-items:center;
                 font-size:0.8rem;border-right:1px solid var(--border);background:var(--surface-1);overflow:hidden}
    .programs-col{flex:1;position:relative;height:44px;overflow:hidden}

    /* time header row */
    .time-header .programs-col{height:26px;background:#0d0d1a;border-bottom:1px solid #1e2030}
    .time-label{position:absolute;transform:translateX(-50%);font-size:0.75rem;color:var(--text-dim);top:5px;white-space:nowrap}

    /* program blocks */
    .program{position:absolute;top:1px;height:42px;overflow:hidden;cursor:pointer;
             display:flex;align-items:center;padding:0 7px;font-size:0.82rem;
             background:var(--surface-2);border-right:1px solid #0f0f0f;
             transition:background 0.1s}
    .program:hover{background:#222;z-index:2}
    .program.live{background:var(--live-tint)}
    .program.live:hover{background:#203a20}
    .live-badge{background:var(--live);color:#fff;font-size:0.6rem;font-weight:700;
                padding:1px 4px;border-radius:2px;margin-right:5px;flex-shrink:0;letter-spacing:0.5px}
    .program-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* "now" line */
    .now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);
              z-index:5;pointer-events:none}

    /* keyboard focus rings (#31) */
    .program:focus-visible,.nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

    /* ── mobile ───────────────────────────────────────────────── */
    @media(max-width:600px){
      .channel-col{width:80px;font-size:0.7rem;padding:0 5px}
      .epg-grid{min-width:400px}
      .time-range{display:none}
      #player-info{padding:6px 8px}
      .pi-logo{width:24px;height:24px}
      .pi-cat-text{display:none}
    }

    @media(min-width:1280px){
      #player-panel video{max-height:60vh}
    }

    /* ── status badges (health + budget) ─────────────────────── */
    .status-badge{display:inline-block;width:1.4em;text-align:center;font-size:0.72rem;
                  border-radius:3px;padding:1px 2px;vertical-align:middle;line-height:1}
    .health-ok{color:var(--ok)}
    .health-down{color:var(--accent)}
    .health-unknown{color:var(--text-dim)}
    .budget-direct{background:#0d2a40;color:#64b5f6}
    .budget-proxied{background:#3a2800;color:#ffb74d}
    .budget-unknown{background:transparent}

    /* ── loading skeleton (#33) ───────────────────────────────── */
    #epg-skeleton{display:none}
    #epg-skeleton.htmx-request,.htmx-request #epg-skeleton{display:block;
      position:absolute;top:0;left:0;right:0;z-index:10;background:var(--bg)}
    .skel-row{display:flex;min-height:44px;border-bottom:1px solid var(--border-subtle)}
    .skel-chan{width:140px;flex-shrink:0;border-right:1px solid var(--border);
      background:var(--surface-1);display:flex;align-items:center;padding:0 10px}
    .skel-progs{flex:1;display:flex;gap:2px;padding:1px;align-items:center;height:44px}
    .skel-progs .shim{height:42px}
    .shim{background:var(--surface-2);border-radius:3px;
      background-image:linear-gradient(90deg,var(--surface-2) 0,#262626 150px,var(--surface-2) 300px);
      background-size:600px 100%;animation:shimmer 1.2s infinite linear}
    @keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}
    @media(max-width:600px){.skel-chan{width:80px}}
  </style>
</head>
<body>
  <header class="site-header">
    <h1>MyTV</h1>
    <nav class="site-nav"><a href="/admin">Admin</a></nav>
  </header>

  {% block content %}{% endblock %}

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // ── player ────────────────────────────────────────────────
      const video = document.getElementById('video');
      let hls = null;
      let currentChannelId = null;
      let currentUrl = null;
      let currentChannel = null;
      let dash = null;
      let dashErrorFired = false;
      var endedHops = 0;
      var endedAdvanceGen = 0;
      var waitingGen = 0;
      var waitingStep = 0;
      var WAITING_BACKOFF = [15, 30, 60, 120];

      function hashColor(str) {
        var h = 0;
        for (var i = 0; i < str.length; i++) {
          h = (str.charCodeAt(i) + ((h << 5) - h)) | 0;
        }
        return 'hsl(' + (Math.abs(h) % 360) + ',35%,28%)';
      }

      function channelIcon(category) {
        var c = (category || '').toLowerCase();
        if (c.indexOf('news') >= 0) return '📰';
        if (c.indexOf('sport') >= 0) return '⚽';
        if (c.indexOf('movie') >= 0 || c.indexOf('film') >= 0 || c.indexOf('cinema') >= 0) return '🎬';
        if (c.indexOf('music') >= 0) return '🎵';
        if (c.indexOf('kid') >= 0 || c.indexOf('child') >= 0) return '🧒';
        if (c.indexOf('documentary') >= 0 || c.indexOf('docu') >= 0) return '🎥';
        if (c.indexOf('entertainment') >= 0) return '🎭';
        if (c.indexOf('cooking') >= 0 || c.indexOf('food') >= 0) return '🍳';
        if (c.indexOf('travel') >= 0) return '✈️';
        if (c.indexOf('science') >= 0 || c.indexOf('tech') >= 0) return '🔬';
        return '📺';
      }

      function escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function renderInfoBar(channel) {
        var bar = document.getElementById('player-info');
        if (!bar || !channel) return;

        var logoEl = bar.querySelector('.pi-logo');
        if (channel.logo_url) {
          var img = document.createElement('img');
          img.setAttribute('src', channel.logo_url);
          img.alt = '';
          img.style.cssText = 'width:100%;height:100%;object-fit:contain';
          logoEl.style.background = 'transparent';
          logoEl.innerHTML = '';
          logoEl.appendChild(img);
        } else {
          logoEl.style.background = hashColor(channel.name || '');
          logoEl.innerHTML = '<span>' + escHtml((channel.name || '?')[0].toUpperCase()) + '</span>';
        }

        bar.querySelector('.pi-name').textContent = channel.name || '';
        bar.querySelector('.pi-cat-icon').textContent = channelIcon(channel.category);
        bar.querySelector('.pi-cat-text').textContent = channel.category ? ' ' + channel.category : '';

        var liveEl = bar.querySelector('.pi-live');
        liveEl.style.display = channel.channel_type === 'live' ? '' : 'none';

        var posEl = bar.querySelector('.pi-pos');
        var channels = window.epgChannels || [];
        var idx = -1;
        for (var i = 0; i < channels.length; i++) {
          if (channels[i].id === channel.channel_id) { idx = i; break; }
        }
        if (idx >= 0) {
          posEl.textContent = 'Ch ' + (idx + 1) + ' / ' + channels.length;
          posEl.style.display = '';
        } else {
          posEl.style.display = 'none';
        }

        bar.style.display = 'flex';
      }

      if (video && Hls.isSupported()) {
        hls = new Hls();
        hls.attachMedia(video);
      }

      if (hls) {
        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data.fatal && currentChannelId) {
            if (typeof debugLog === 'function') debugLog('warn', 'HLS fatal: ' + data.type + ' / ' + data.details);
            console.warn('hls fatal error, trying next source:', data.type, data.details);
            var nextUrl = '/channel/' + currentChannelId + '/next';
            if (currentUrl) nextUrl += '?failed_url=' + encodeURIComponent(currentUrl);
            fetch(nextUrl)
              .then(function(r) {
                if (!r.ok) { showPlayerError(); return; }
                return r.json();
              })
              .then(function(d) { applyTuneResponse(d); })
              .catch(function(err) { if (typeof debugLog === 'function') debugLog('error', 'failover: ' + err); console.error('failover error:', err); showPlayerError(); });
          }
        });
      }

      function proxyUrl(url) {
        if (!url || url.startsWith('/')) return url;
        var origin = window.location.origin;
        if (url.startsWith(origin)) return url;
        return '/stream-proxy?url=' + encodeURIComponent(url);
      }

      function _loadSource(url, offset, skipProxy) {
        if (window.__showBuffering) window.__showBuffering();
        currentUrl = url;
        dashErrorFired = false;
        var isDash = url.indexOf('.mpd') >= 0;
        var isHls  = url.indexOf('.m3u8') >= 0;
        url = proxyUrl(url);

        if (isDash) {
          if (hls) { hls.stopLoad(); hls.detachMedia(); }
          if (dash) { dash.reset(); dash = null; }
          dash = dashjs.MediaPlayer().create();
          dash.on(dashjs.MediaPlayer.events.ERROR, function(e) {
            if (dashErrorFired || !currentChannelId) return;
            dashErrorFired = true;
            if (typeof debugLog === 'function') debugLog('warn', 'DASH error: ' + (e && e.error ? e.error.code || e.error : 'unknown') + ', trying next source');
            var nextUrl = '/channel/' + currentChannelId + '/next';
            if (currentUrl) nextUrl += '?failed_url=' + encodeURIComponent(currentUrl);
            fetch(nextUrl)
              .then(function(r) { if (!r.ok) { showPlayerError(); return null; } return r.json(); })
              .then(function(d) { applyTuneResponse(d); })
              .catch(function(err) {
                if (typeof debugLog === 'function') debugLog('error', 'DASH failover: ' + err);
                showPlayerError();
              });
          });
          if (offset > 0) {
            dash.on(dashjs.MediaPlayer.events.MANIFEST_LOADED, function onManifest() {
              dash.off(dashjs.MediaPlayer.events.MANIFEST_LOADED, onManifest);
              video.currentTime = offset;
              video.play().catch(function(){});
            });
          }
          // autoPlay=true: dash.js calls video.play() internally after manifest load
          dash.initialize(video, url, true);
        } else if (isHls) {
          if (dash) { dash.reset(); dash = null; }
          if (hls) hls.attachMedia(video);
          if (hls) {
            hls.loadSource(url);
            hls.once(Hls.Events.MANIFEST_PARSED, function() {
              if (offset > 0) video.currentTime = offset;
              video.play().catch(function(){});
            });
          } else if (video && video.canPlayType('application/vnd.apple.mpegurl')) {
            video.onerror = function() {
              var nextUrl = '/channel/' + currentChannelId + '/next';
              if (currentUrl) nextUrl += '?failed_url=' + encodeURIComponent(currentUrl);
              fetch(nextUrl)
                .then(function(r) {
                  if (!r.ok) { showPlayerError(); return; }
                  return r.json();
                })
                .then(function(d) { applyTuneResponse(d); })
                .catch(function(err) {
                  if (typeof debugLog === 'function') debugLog('error', 'native HLS: ' + err);
                  console.error('native hls error:', err);
                  showPlayerError();
                });
            };
            video.src = url;
            if (offset > 0) {
              video.addEventListener('loadedmetadata', function onMeta() {
                video.removeEventListener('loadedmetadata', onMeta);
                video.currentTime = offset;
                video.play().catch(function(){});
              });
            } else {
              video.play().catch(function(){});
            }
          }
        } else {
          // Direct MP4 (e.g. YouTube VOD resolved via yt-dlp)
          if (hls) { hls.stopLoad(); hls.detachMedia(); }
          if (dash) { dash.reset(); dash = null; }
          video.onerror = function() {
            if (typeof debugLog === 'function') debugLog('warn', 'video error (direct): code ' + (video.error ? video.error.code : '?'));
            // On-demand: a failed item must not fall back to /next (which would
            // jump to item 1). Show the error and leave the playlist for the viewer.
            if (odChannelId === currentChannelId) { odSkipFrom(odIndex); return; }
            var nextUrl = '/channel/' + currentChannelId + '/next';
            if (currentUrl) nextUrl += '?failed_url=' + encodeURIComponent(currentUrl);
            fetch(nextUrl)
              .then(function(r) { if (!r.ok) { showPlayerError(); return; } return r.json(); })
              .then(function(d) { applyTuneResponse(d); })
              .catch(function() { showPlayerError(); });
          };
          video.src = skipProxy ? currentUrl : url;
          if (offset > 0) {
            video.addEventListener('loadedmetadata', function onMeta() {
              video.removeEventListener('loadedmetadata', onMeta);
              video.currentTime = offset;
              video.play().catch(function(){});
            });
          } else {
            video.play().catch(function(){});
          }
        }
      }

      function stopPlayback() {
        if (!video) return;
        video.pause();
        video.onerror = null; // avoid a stale onerror firing a spurious failover as we tear down
        if (hls) { hls.stopLoad(); hls.detachMedia(); }
        if (dash) { dash.reset(); dash = null; }
        video.removeAttribute('src');
        video.load();
      }

      function showPlayerError() {
        if (window.__hideBuffering) window.__hideBuffering();
        stopPlayback();
        if (video) video.style.display = 'none';
        var el = document.getElementById('player-error');
        if (el) el.style.display = 'block';
        if (typeof debugLog === 'function') debugLog('error', 'Channel unavailable — all sources exhausted');
      }

      function hidePlayerError() {
        if (video) video.style.display = '';
        var el = document.getElementById('player-error');
        if (el) el.style.display = 'none';
      }

      var _toastTimer = null;
      function showToast(msg) {
        var el = document.getElementById('player-toast');
        if (!el) return;
        el.textContent = msg;
        el.hidden = false;
        if (_toastTimer) clearTimeout(_toastTimer);
        _toastTimer = setTimeout(function () { el.hidden = true; }, 2500);
      }

      // Advance past a dead on-demand item. `failedIndex` is the item that just
      // failed (to play or to resolve). Forward-only: if nothing follows, show
      // the error overlay. Never wraps, so an all-dead playlist terminates.
      function odSkipFrom(failedIndex) {
        var next = odNextAvailable(failedIndex + 1);
        var failed = odItems[failedIndex];
        if (next >= 0) {
          if (failed) showToast(failed.title + ' unavailable — skipping…');
          if (typeof debugLog === 'function') {
            debugLog('warn', 'skip item ' + (failed ? failed.title : failedIndex) + ' → ' + odItems[next].title);
          }
          odPlayIndex(next, 0);
        } else {
          if (typeof debugLog === 'function') debugLog('warn', 'no playable item after ' + failedIndex);
          showPlayerError();
        }
      }

      function nextChannelId(dir) {
        var channels = window.epgChannels || [];
        if (!channels.length || !currentChannelId) return null;
        var idx = -1;
        for (var i = 0; i < channels.length; i++) {
          if (channels[i].id === currentChannelId) { idx = i; break; }
        }
        if (idx < 0) idx = 0;
        var n = dir === 'up'
          ? (idx - 1 + channels.length) % channels.length
          : (idx + 1) % channels.length;
        return channels[n].id;
      }

      function advanceEndedChannel() {
        if (window.__hideBuffering) window.__hideBuffering();
        var channels = window.epgChannels || [];
        endedHops++;
        if (!channels.length || endedHops > channels.length) {
          endedHops = 0;
          showPlayerError();
          return;
        }
        if (typeof debugLog === 'function') debugLog('info', 'broadcast ended — advancing channel');
        var notice = document.getElementById('player-ended');
        if (notice) notice.style.display = 'block';
        var nextId = nextChannelId('down');
        var gen = ++endedAdvanceGen;
        setTimeout(function() {
          if (gen !== endedAdvanceGen) return;
          if (notice) notice.style.display = 'none';
          if (nextId) tune(nextId);
          else showPlayerError();
        }, 1500);
      }

      function enterWaitingState() {
        if (window.__hideBuffering) window.__hideBuffering();
        stopPlayback();
        if (video) video.style.display = 'none';
        currentUrl = null; // avoid stale ?failed_url= if a late onerror fires while waiting
        var el = document.getElementById('player-waiting');
        if (waitingStep >= WAITING_BACKOFF.length) {
          if (el) { el.textContent = 'Channel offline'; el.style.display = 'block'; }
          return;
        }
        if (el) { el.textContent = 'Waiting for stream…'; el.style.display = 'block'; }
        var delay = WAITING_BACKOFF[waitingStep];
        waitingStep++;
        var gen = ++waitingGen;
        if (typeof debugLog === 'function') debugLog('info', 'waiting for stream, retry in ' + delay + 's');
        setTimeout(function() {
          if (gen !== waitingGen || !currentChannelId) return;
          fetch('/channel/' + currentChannelId + '/tune')
            .then(function(r) { if (!r.ok) { showPlayerError(); return null; } return r.json(); })
            .then(function(d) { if (gen === waitingGen) applyTuneResponse(d); })
            .catch(function() { showPlayerError(); });
        }, delay * 1000);
      }

      function applyTuneResponse(d) {
        if (!d) return;
        if (d.waiting) { enterWaitingState(); return; }
        waitingStep = 0;
        waitingGen++;
        var wEl = document.getElementById('player-waiting');
        if (wEl) wEl.style.display = 'none';
        if (video) video.style.display = '';
        if (d.ended) { advanceEndedChannel(); return; }
        endedHops = 0;
        if (d.url) _loadSource(d.url, d.start_offset_secs, d.skip_proxy);
      }

      // ── on-demand VOD (#45) ───────────────────────────────────
      var odItems = [];          // [{id, title, duration_secs}]
      var odIndex = -1;          // index into odItems of the item actually loaded
      var odChannelId = null;    // channel id the playlist belongs to
      var odPlayGen = 0;         // bumps per selection; guards out-of-order resolves

      function odKey(id) { return 'mytv:ondemand:' + id; }

      function odLoadCursor(id) {
        try {
          var raw = localStorage.getItem(odKey(id));
          if (!raw) return null;
          var c = JSON.parse(raw);
          if (c && typeof c.itemId === 'number') return c;
        } catch (e) {}
        return null;
      }

      function odSaveCursor() {
        if (odChannelId == null || odIndex < 0 || !odItems[odIndex]) return;
        try {
          localStorage.setItem(odKey(odChannelId), JSON.stringify({
            itemId: odItems[odIndex].id,
            offset: video ? video.currentTime || 0 : 0
          }));
        } catch (e) {}
      }

      function odFmtDur(secs) {
        secs = Math.max(0, Math.floor(secs || 0));
        var m = Math.floor(secs / 60), s = secs % 60;
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      // Disabled items carry available=false; treat a missing flag as available
      // for backward-compat with any cached/older response shape.
      function odAvailable(it) { return !it || it.available !== false; }

      // First playable index at or after `from`, or -1 if none remain.
      function odNextAvailable(from) {
        for (var i = Math.max(0, from); i < odItems.length; i++) {
          if (odAvailable(odItems[i])) return i;
        }
        return -1;
      }

      function odRenderList() {
        var box = document.getElementById('player-playlist');
        if (!box) return;
        box.innerHTML = '';
        odItems.forEach(function(it, i) {
          var avail = odAvailable(it);
          var row = document.createElement('div');
          row.className = 'pl-row' + (i === odIndex ? ' current' : '') + (avail ? '' : ' unavailable');
          var mark = document.createElement('span');
          mark.className = 'pl-mark';
          mark.textContent = i === odIndex ? '▶' : (avail ? '' : '⊘');
          var title = document.createElement('span');
          title.className = 'pl-title';
          title.textContent = it.title;
          title.title = it.title;
          var dur = document.createElement('span');
          dur.className = 'pl-dur';
          dur.textContent = odFmtDur(it.duration_secs);
          row.appendChild(mark); row.appendChild(title); row.appendChild(dur);
          // Unavailable (disabled) items are shown but inert: no click/keyboard
          // selection and out of the tab order.
          if (avail) {
            row.setAttribute('role', 'button');
            row.setAttribute('tabindex', '0');
            row.addEventListener('click', function() { odPlayIndex(i, 0); });
            row.addEventListener('keydown', function(e) {
              if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); odPlayIndex(i, 0); }
            });
          } else {
            row.setAttribute('aria-disabled', 'true');
          }
          box.appendChild(row);
        });
      }

      function odPlayIndex(i, offset) {
        if (i < 0 || i >= odItems.length) return;
        // Token this selection. odIndex / the ▶ highlight only move once THIS
        // item actually loads, and a stale resolve (slower than a newer click
        // or auto-advance) is dropped — so the highlight always matches the
        // item in the <video>, never a request still in flight.
        var gen = ++odPlayGen;
        var chanAtRequest = odChannelId;
        fetch('/channel/' + odChannelId + '/item/' + odItems[i].id)
          .then(function(r) { if (!r.ok) throw new Error('item ' + r.status); return r.json(); })
          .then(function(d) {
            if (gen !== odPlayGen || chanAtRequest !== odChannelId) return; // superseded
            odIndex = i;
            odRenderList();
            currentChannel = Object.assign({ channel_id: odChannelId }, d);
            renderInfoBar(currentChannel);
            if (video) video.style.display = '';
            hidePlayerError();
            _loadSource(d.url, offset || 0, d.skip_proxy);
            odSaveCursor();
          })
          .catch(function(err) {
            if (gen !== odPlayGen || chanAtRequest !== odChannelId) return;
            if (typeof debugLog === 'function') debugLog('error', 'on-demand item: ' + err);
            odSkipFrom(i);
          });
      }

      function odTune(channelId, startItemId) {
        odChannelId = channelId;
        odItems = [];
        odIndex = -1;
        // Clear the panel now so the previous channel's items never linger while
        // this channel's playlist is still loading (fixes cross-channel leak).
        odRenderList();
        var btn = document.getElementById('ov-playlist');
        if (btn) btn.hidden = false;
        document.getElementById('player-panel').style.display = 'block';
        fetch('/channel/' + channelId + '/playlist')
          .then(function(r) { if (!r.ok) throw new Error('playlist ' + r.status); return r.json(); })
          .then(function(items) {
            if (channelId !== odChannelId) return; // superseded by a newer switch
            odItems = items || [];
            if (typeof debugLog === 'function') debugLog('info', 'playlist loaded: ' + odItems.length + ' item(s)');
            if (!odItems.length) { showPlayerError(); return; }
            var start = -1, offset = 0;
            if (startItemId != null) {
              for (var i = 0; i < odItems.length; i++) {
                if (odItems[i].id === startItemId) { start = i; offset = 0; break; }
              }
            } else {
              var cursor = odLoadCursor(channelId);
              if (cursor) {
                for (var i = 0; i < odItems.length; i++) {
                  if (odItems[i].id === cursor.itemId) { start = i; offset = cursor.offset || 0; break; }
                }
              }
            }
            // Land on the first playable item at/after the requested start (the
            // saved/clicked item may since have been disabled).
            if (start < 0 || !odAvailable(odItems[start])) { start = odNextAvailable(start < 0 ? 0 : start); offset = 0; }
            if (start < 0) start = odNextAvailable(0);
            odRenderList();
            // Open the playlist by default so items are immediately clickable.
            var box = document.getElementById('player-playlist');
            if (box) box.hidden = false;
            if (start < 0) { showPlayerError(); return; } // every item disabled
            odPlayIndex(start, offset);
          })
          .catch(function(err) {
            if (typeof debugLog === 'function') debugLog('error', 'on-demand tune: ' + err);
            showPlayerError();
          });
      }

      function odChannelType(channelId) {
        var channels = window.epgChannels || [];
        for (var i = 0; i < channels.length; i++) {
          if (channels[i].id === channelId) return channels[i].type;
        }
        return null;
      }

      function tune(channelId, itemId) {
        currentChannelId = channelId;
        currentUrl = null;
        if (typeof debugLog === 'function') debugLog('info', 'switch → channel ' + channelId + ' (' + (odChannelType(channelId) || '?') + ')');
        if (odChannelType(channelId) === 'vod_on_demand') {
          hidePlayerError();
          odTune(channelId, itemId);
          return;
        }
        var plBtn = document.getElementById('ov-playlist');
        if (plBtn) plBtn.hidden = true;
        var plList = document.getElementById('player-playlist');
        if (plList) plList.hidden = true;
        odChannelId = null; odItems = []; odIndex = -1;
        odRenderList(); // drop the previous channel's items so they can't be revealed
        hidePlayerError();
        endedAdvanceGen++;
        waitingGen++;
        waitingStep = 0;
        var waitingNotice = document.getElementById('player-waiting');
        if (waitingNotice) waitingNotice.style.display = 'none';
        if (video) video.style.display = '';
        var endedNotice = document.getElementById('player-ended');
        if (endedNotice) endedNotice.style.display = 'none';
        stopPlayback();
        document.getElementById('player-panel').style.display = 'block';
        fetch('/channel/' + channelId + '/tune')
          .then(function(r) {
            if (!r.ok) throw new Error('tune failed: ' + r.status);
            return r.json();
          })
          .then(function(d) {
            if (typeof debugLog === 'function') debugLog('info', 'tune resp: ' + (d.ended ? 'ended' : d.waiting ? 'waiting' : (d.url ? 'playing' : 'no url')) + (d.skip_proxy ? ' (direct)' : ''));
            currentChannel = Object.assign({ channel_id: channelId }, d);
            renderInfoBar(currentChannel);
            applyTuneResponse(d);
          })
          .catch(function(err) { if (typeof debugLog === 'function') debugLog('error', 'tune: ' + err); console.error('tune error:', err); showPlayerError(); });
      }

      if (video) {
        video.addEventListener('ended', function() {
          if (!currentChannelId) return;
          if (odChannelId === currentChannelId) {
            var n = odNextAvailable(odIndex + 1);
            if (n >= 0) {
              if (typeof debugLog === 'function') debugLog('info', 'auto-advance → ' + odItems[n].title);
              odPlayIndex(n, 0);
            } else if (typeof debugLog === 'function') {
              debugLog('info', 'end of playlist');
            }
            // else: no playable item left — stop silently (no auto-advance)
            return;
          }
          fetch('/channel/' + currentChannelId + '/next')
            .then(function(r) { if (!r.ok) throw new Error('next failed: ' + r.status); return r.json(); })
            .then(function(d) { applyTuneResponse(d); })
            .catch(function(err) { if (typeof debugLog === 'function') debugLog('error', 'next: ' + err); console.error('next error:', err); showPlayerError(); });
        });
      }

      window.tune = tune;

      // ── custom transport (idea #51) ───────────────────────────
      function togglePlay() {
        if (!video) return;
        if (video.paused) { video.play().catch(function(){}); }
        else { video.pause(); }
      }

      function syncPlayPauseIcon() {
        var pp = document.getElementById('ov-playpause');
        var cp = document.getElementById('ov-center-play');
        var paused = !video || video.paused;
        if (pp) pp.textContent = paused ? '▶' : '⏸';
        if (cp) cp.textContent = paused ? '▶' : '⏸';
      }

      function closePlayer() {
        stopPlayback();
        var p = document.getElementById('player-panel');
        if (p) p.style.display = 'none';
        var pl = document.getElementById('player-playlist');
        if (pl) pl.hidden = true;
        currentChannelId = null;
        odChannelId = null; odItems = []; odIndex = -1;
      }

      function toggleFullscreen() {
        var p = document.getElementById('player-panel');
        if (!p) return;
        if (document.fullscreenElement) { document.exitFullscreen(); }
        else { p.requestFullscreen().catch(function(){}); }
      }

      // ── player overlay toolbar (#32) ──────────────────────────
      var panel = document.getElementById('player-panel');
      var helpBox = document.getElementById('player-help');
      var hideControlsTimer = null;
      function showControls() {
        if (!panel) return;
        panel.classList.add('show-controls');
        if (hideControlsTimer) clearTimeout(hideControlsTimer);
        hideControlsTimer = setTimeout(function() {
          panel.classList.remove('show-controls');
          if (helpBox) helpBox.hidden = true;
        }, 3000);
      }
      if (panel) {
        panel.addEventListener('mousemove', showControls);
        panel.addEventListener('touchstart', showControls, {passive: true});
        panel.addEventListener('focusin', showControls);
      }
      var ovClose = document.getElementById('ov-close');
      var ovHelp = document.getElementById('ov-help');
      var ovPlayPause = document.getElementById('ov-playpause');
      var ovCenterPlay = document.getElementById('ov-center-play');
      var ovFull = document.getElementById('ov-fullscreen');
      if (ovClose) ovClose.addEventListener('click', closePlayer);
      if (ovHelp) ovHelp.addEventListener('click', function() {
        if (helpBox) helpBox.hidden = !helpBox.hidden;
      });
      if (ovPlayPause) ovPlayPause.addEventListener('click', togglePlay);
      if (ovCenterPlay) ovCenterPlay.addEventListener('click', togglePlay);
      if (ovFull) ovFull.addEventListener('click', toggleFullscreen);

      var ovPlaylist = document.getElementById('ov-playlist');
      var plBox = document.getElementById('player-playlist');
      if (ovPlaylist) ovPlaylist.addEventListener('click', function() {
        if (!plBox || odChannelId !== currentChannelId || !odItems.length) return;
        plBox.hidden = !plBox.hidden;
      });

      if (video) {
        video.addEventListener('play', syncPlayPauseIcon);
        video.addEventListener('pause', syncPlayPauseIcon);
      }

      // ── buffering overlay (#33) ───────────────────────────────
      function showBuffering() {
        var el = document.getElementById('player-buffering');
        if (el) el.classList.add('show');
      }
      function hideBuffering() {
        var el = document.getElementById('player-buffering');
        if (el) el.classList.remove('show');
      }
      window.__showBuffering = showBuffering;
      window.__hideBuffering = hideBuffering;
      if (video) {
        video.addEventListener('playing', hideBuffering);
        video.addEventListener('canplay', hideBuffering);
        video.addEventListener('pause', hideBuffering);
        video.addEventListener('error', hideBuffering);
      }

      if (video) {
        var odSaveT = null;
        video.addEventListener('timeupdate', function() {
          if (odChannelId == null) return;
          if (odSaveT) return;
          odSaveT = setTimeout(function() { odSaveT = null; odSaveCursor(); }, 2000);
        });
        video.addEventListener('pause', odSaveCursor);
      }
      window.addEventListener('beforeunload', odSaveCursor);

      var autoCid = window.__autoTuneChannelId;
      if (autoCid != null) {
        history.replaceState(null, '', '/watch/' + autoCid);
        tune(autoCid);
      }

      document.addEventListener('keydown', function(e) {
        var tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

        if (e.key === ' ') {
          e.preventDefault();
          if (!video) return;
          if (video.paused) { video.play().catch(function(){}); }
          else { video.pause(); }
          return;
        }

        if (e.key === 'f' || e.key === 'F') {
          if (!video) return;
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            video.requestFullscreen().catch(function(){});
          }
          return;
        }

        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          e.preventDefault();
          var nextId = nextChannelId(e.key === 'ArrowUp' ? 'up' : 'down');
          if (nextId) tune(nextId);
          return;
        }

        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          if (!currentChannel || currentChannel.channel_type !== 'vod_loop') return;
          if (!video || video.readyState < 1) return;
          e.preventDefault();
          video.currentTime += e.key === 'ArrowRight' ? 10 : -10;
          return;
        }
      });
    });
  </script>
</body>
</html>
