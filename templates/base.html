<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e94560">
  <title>MyTV</title>
  <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f0f0f;color:#e0e0e0;font-family:system-ui,sans-serif;min-height:100vh}
    a{color:inherit;text-decoration:none}

    /* ── header ───────────────────────────────────────────────── */
    .site-header{background:#111;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222}
    .site-header h1{font-size:1.1rem;color:#e94560;letter-spacing:1px}

    /* ── player panel ─────────────────────────────────────────── */
    #player-panel{display:none;background:#000;border-bottom:2px solid #e94560}
    #player-panel video{width:100%;max-height:50vh;display:block}
    #player-error{display:none;padding:32px;text-align:center;color:#e94560;background:#000;font-size:1rem}

    /* ── player info bar ──────────────────────────────────────────── */
    #player-info{display:none;align-items:center;gap:10px;padding:8px 12px;
                 background:#111;border-bottom:1px solid #1c1c1c}
    .pi-logo{width:28px;height:28px;border-radius:3px;flex-shrink:0;
             display:flex;align-items:center;justify-content:center;
             overflow:hidden;background:#222}
    .pi-logo img{width:100%;height:100%;object-fit:contain}
    .pi-logo span{color:#fff;font-size:13px;font-weight:700}
    .pi-meta{flex:1;min-width:0}
    .pi-name{display:block;color:#fff;font-size:0.85rem;font-weight:600;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pi-cat{display:block;color:#666;font-size:0.75rem}
    .pi-live{background:#c0001a;color:#fff;font-size:0.6rem;font-weight:700;
             padding:1px 5px;border-radius:2px;letter-spacing:0.5px;flex-shrink:0}
    .pi-pos{font-size:0.75rem;color:#555;flex-shrink:0}

    /* ── epg nav (tabs + time nav) ────────────────────────────── */
    .epg-nav{display:flex;align-items:center;justify-content:space-between;
             flex-wrap:wrap;gap:8px;padding:8px 12px;background:#141420;border-bottom:1px solid #222}
    .tabs{display:flex;gap:6px;flex-wrap:wrap}
    .tab{padding:3px 12px;border-radius:3px;cursor:pointer;border:1px solid #333;
         background:#1a1a1a;color:#999;font-size:0.82rem}
    .tab.active,.tab:hover{background:#e94560;color:#fff;border-color:#e94560}
    .time-nav{display:flex;align-items:center;gap:10px}
    .nav-btn{padding:3px 12px;background:#222;color:#bbb;border:1px solid #333;
             border-radius:3px;cursor:pointer;font-size:0.82rem}
    .nav-btn:hover{background:#333}
    .time-range{font-size:0.8rem;color:#777;min-width:120px;text-align:center}

    /* ── epg grid ─────────────────────────────────────────────── */
    .epg-wrapper{overflow-x:auto}
    .epg-grid{min-width:700px}
    .epg-row{display:flex;border-bottom:1px solid #1c1c1c;min-height:44px}
    .channel-col{width:140px;flex-shrink:0;padding:0 10px;display:flex;align-items:center;
                 font-size:0.8rem;border-right:1px solid #222;background:#111;overflow:hidden}
    .programs-col{flex:1;position:relative;height:44px;overflow:hidden}

    /* time header row */
    .time-header .programs-col{height:26px;background:#0d0d1a;border-bottom:1px solid #1e2030}
    .time-label{position:absolute;transform:translateX(-50%);font-size:0.7rem;color:#555;top:5px;white-space:nowrap}

    /* program blocks */
    .program{position:absolute;top:1px;height:42px;overflow:hidden;cursor:pointer;
             display:flex;align-items:center;padding:0 7px;font-size:0.78rem;
             background:#1a2235;border-right:1px solid #0f0f0f;
             transition:background 0.1s}
    .program:hover{background:#22304a;z-index:2}
    .program.live{background:#1a2a1a}
    .program.live:hover{background:#203220}
    .live-badge{background:#c0001a;color:#fff;font-size:0.6rem;font-weight:700;
                padding:1px 4px;border-radius:2px;margin-right:5px;flex-shrink:0;letter-spacing:0.5px}
    .program-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* "now" line */
    .now-line{position:absolute;top:0;bottom:0;width:2px;background:#e94560;
              z-index:5;pointer-events:none}

    /* ── mobile ───────────────────────────────────────────────── */
    @media(max-width:600px){
      .channel-col{width:80px;font-size:0.7rem;padding:0 5px}
      .epg-grid{min-width:400px}
      .time-range{display:none}
      #player-info{padding:6px 8px}
      .pi-logo{width:24px;height:24px}
      .pi-cat-text{display:none}
    }

    @media(min-width:1280px){
      #player-panel video{max-height:60vh}
    }

    /* ── status badges (health + budget) ─────────────────────── */
    .status-badge{display:inline-block;width:1.4em;text-align:center;font-size:0.72rem;
                  border-radius:3px;padding:1px 2px;vertical-align:middle;line-height:1}
    .health-ok{color:#4caf50}
    .health-down{color:#e94560}
    .health-unknown{color:#666}
    .budget-direct{background:#0d2a40;color:#64b5f6}
    .budget-proxied{background:#3a2800;color:#ffb74d}
    .budget-unknown{background:transparent}
  </style>
</head>
<body>
  <header class="site-header">
    <h1>MyTV</h1>
    <nav style="display:flex;gap:12px;font-size:0.85rem"><a href="/admin" style="color:#999;text-decoration:none">Admin</a></nav>
  </header>

  {% block content %}{% endblock %}

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // ── player ────────────────────────────────────────────────
      const video = document.getElementById('video');
      let hls = null;
      let currentChannelId = null;
      let currentUrl = null;
      let currentChannel = null;

      function hashColor(str) {
        var h = 0;
        for (var i = 0; i < str.length; i++) {
          h = (str.charCodeAt(i) + ((h << 5) - h)) | 0;
        }
        return 'hsl(' + (Math.abs(h) % 360) + ',35%,28%)';
      }

      function channelIcon(category) {
        var c = (category || '').toLowerCase();
        if (c.indexOf('news') >= 0) return '📰';
        if (c.indexOf('sport') >= 0) return '⚽';
        if (c.indexOf('movie') >= 0 || c.indexOf('film') >= 0 || c.indexOf('cinema') >= 0) return '🎬';
        if (c.indexOf('music') >= 0) return '🎵';
        if (c.indexOf('kid') >= 0 || c.indexOf('child') >= 0) return '🧒';
        if (c.indexOf('documentary') >= 0 || c.indexOf('docu') >= 0) return '🎥';
        if (c.indexOf('entertainment') >= 0) return '🎭';
        if (c.indexOf('cooking') >= 0 || c.indexOf('food') >= 0) return '🍳';
        if (c.indexOf('travel') >= 0) return '✈️';
        if (c.indexOf('science') >= 0 || c.indexOf('tech') >= 0) return '🔬';
        return '📺';
      }

      function escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function renderInfoBar(channel) {
        var bar = document.getElementById('player-info');
        if (!bar || !channel) return;

        var logoEl = bar.querySelector('.pi-logo');
        if (channel.logo_url) {
          var img = document.createElement('img');
          img.setAttribute('src', channel.logo_url);
          img.alt = '';
          img.style.cssText = 'width:100%;height:100%;object-fit:contain';
          logoEl.style.background = 'transparent';
          logoEl.innerHTML = '';
          logoEl.appendChild(img);
        } else {
          logoEl.style.background = hashColor(channel.name || '');
          logoEl.innerHTML = '<span>' + escHtml((channel.name || '?')[0].toUpperCase()) + '</span>';
        }

        bar.querySelector('.pi-name').textContent = channel.name || '';
        bar.querySelector('.pi-cat-icon').textContent = channelIcon(channel.category);
        bar.querySelector('.pi-cat-text').textContent = channel.category ? ' ' + channel.category : '';

        var liveEl = bar.querySelector('.pi-live');
        liveEl.style.display = channel.channel_type === 'live' ? '' : 'none';

        var posEl = bar.querySelector('.pi-pos');
        var channels = window.epgChannels || [];
        var idx = -1;
        for (var i = 0; i < channels.length; i++) {
          if (channels[i].id === channel.channel_id) { idx = i; break; }
        }
        if (idx >= 0) {
          posEl.textContent = 'Ch ' + (idx + 1) + ' / ' + channels.length;
          posEl.style.display = '';
        } else {
          posEl.style.display = 'none';
        }

        bar.style.display = 'flex';
      }

      if (video && Hls.isSupported()) {
        hls = new Hls();
        hls.attachMedia(video);
      }

      if (hls) {
        hls.on(Hls.Events.ERROR, function(event, data) {
          if (data.fatal && currentChannelId) {
            if (typeof debugLog === 'function') debugLog('warn', 'HLS fatal: ' + data.type + ' / ' + data.details);
            console.warn('hls fatal error, trying next source:', data.type, data.details);
            var nextUrl = '/channel/' + currentChannelId + '/next';
            if (currentUrl) nextUrl += '?failed_url=' + encodeURIComponent(currentUrl);
            fetch(nextUrl)
              .then(function(r) {
                if (!r.ok) { showPlayerError(); return; }
                return r.json();
              })
              .then(function(d) { if (d && d.url) _loadSource(d.url, d.start_offset_secs); })
              .catch(function(err) { if (typeof debugLog === 'function') debugLog('error', 'failover: ' + err); console.error('failover error:', err); showPlayerError(); });
          }
        });
      }

      function proxyUrl(url) {
        if (!url || url.startsWith('/')) return url;
        var origin = window.location.origin;
        if (url.startsWith(origin)) return url;
        return '/stream-proxy?url=' + encodeURIComponent(url);
      }

      function _loadSource(url, offset) {
        currentUrl = url;
        url = proxyUrl(url);
        if (hls) {
          hls.loadSource(url);
          hls.once(Hls.Events.MANIFEST_PARSED, function() {
            if (offset > 0) video.currentTime = offset;
            video.play().catch(function(){});
          });
        } else if (video && video.canPlayType('application/vnd.apple.mpegurl')) {
          video.onerror = function() {
            var nextUrl = '/channel/' + currentChannelId + '/next';
            if (currentUrl) nextUrl += '?failed_url=' + encodeURIComponent(currentUrl);
            fetch(nextUrl)
              .then(function(r) {
                if (!r.ok) { showPlayerError(); return; }
                return r.json();
              })
              .then(function(d) { if (d && d.url) _loadSource(d.url, d.start_offset_secs); })
              .catch(function(err) { if (typeof debugLog === 'function') debugLog('error', 'native HLS: ' + err); console.error('native hls error:', err); showPlayerError(); });
          };
          video.src = url;
          if (offset > 0) {
            video.addEventListener('loadedmetadata', function onMeta() {
              video.removeEventListener('loadedmetadata', onMeta);
              video.currentTime = offset;
              video.play().catch(function(){});
            });
          } else {
            video.play().catch(function(){});
          }
        }
      }

      function showPlayerError() {
        if (video) video.style.display = 'none';
        var el = document.getElementById('player-error');
        if (el) el.style.display = 'block';
        if (typeof debugLog === 'function') debugLog('error', 'Channel unavailable — all sources exhausted');
      }

      function hidePlayerError() {
        if (video) video.style.display = '';
        var el = document.getElementById('player-error');
        if (el) el.style.display = 'none';
      }

      function tune(channelId) {
        currentChannelId = channelId;
        currentUrl = null;
        hidePlayerError();
        document.getElementById('player-panel').style.display = 'block';
        fetch('/channel/' + channelId + '/tune')
          .then(function(r) {
            if (!r.ok) throw new Error('tune failed: ' + r.status);
            return r.json();
          })
          .then(function(d) {
            currentChannel = Object.assign({ channel_id: channelId }, d);
            renderInfoBar(currentChannel);
            _loadSource(d.url, d.start_offset_secs);
          })
          .catch(function(err) { if (typeof debugLog === 'function') debugLog('error', 'tune: ' + err); console.error('tune error:', err); showPlayerError(); });
      }

      if (video) {
        video.addEventListener('ended', function() {
          if (!currentChannelId) return;
          fetch('/channel/' + currentChannelId + '/next')
            .then(function(r) {
              if (!r.ok) throw new Error('next failed: ' + r.status);
              return r.json();
            })
            .then(function(d) {
              if (d.url) _loadSource(d.url, d.start_offset_secs);
            })
            .catch(function(err) { if (typeof debugLog === 'function') debugLog('error', 'next: ' + err); console.error('next error:', err); showPlayerError(); });
        });
      }

      window.tune = tune;

      document.addEventListener('keydown', function(e) {
        var tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

        if (e.key === ' ') {
          e.preventDefault();
          if (!video) return;
          if (video.paused) { video.play().catch(function(){}); }
          else { video.pause(); }
          return;
        }

        if (e.key === 'f' || e.key === 'F') {
          if (!video) return;
          if (document.fullscreenElement) {
            document.exitFullscreen();
          } else {
            video.requestFullscreen().catch(function(){});
          }
          return;
        }

        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          e.preventDefault();
          var channels = window.epgChannels || [];
          if (!channels.length || !currentChannelId) return;
          var idx = -1;
          for (var i = 0; i < channels.length; i++) {
            if (channels[i].id === currentChannelId) { idx = i; break; }
          }
          if (idx < 0) idx = 0;
          var next = e.key === 'ArrowDown'
            ? (idx + 1) % channels.length
            : (idx - 1 + channels.length) % channels.length;
          tune(channels[next].id);
          return;
        }

        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          if (!currentChannel || currentChannel.channel_type !== 'vod_loop') return;
          if (!video || video.readyState < 1) return;
          e.preventDefault();
          video.currentTime += e.key === 'ArrowRight' ? 10 : -10;
          return;
        }
      });
    });
  </script>
</body>
</html>
