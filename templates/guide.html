{% extends "base.html" %}
{% block content %}
<div id="player-panel">
  <video id="video" controls></video>
  <div id="player-error">Channel unavailable</div>
</div>

<div id="player-info">
  <div class="pi-logo"></div>
  <div class="pi-meta">
    <span class="pi-name"></span>
    <span class="pi-cat"><span class="pi-cat-icon"></span><span class="pi-cat-text"></span></span>
  </div>
  <span class="pi-live">LIVE</span>
  <span class="pi-pos"></span>
</div>

<div id="epg-content">
  {% include "partials/epg_content.html" %}
</div>

<div id="debug-panel">
  <div id="debug-header">
    <span style="font-weight:600;letter-spacing:0.5px">Debug</span>
    <span id="debug-count" style="color:#555;font-size:0.75rem;margin-left:6px">no messages</span>
    <button id="debug-clear" onclick="debugClear()" style="margin-left:auto;background:none;border:none;color:#555;cursor:pointer;font-size:0.75rem;padding:0">Clear</button>
    <button id="debug-toggle" onclick="debugToggle()" style="margin-left:10px;background:none;border:none;color:#555;cursor:pointer;font-size:0.75rem;padding:0">Hide</button>
  </div>
  <div id="debug-log"></div>
</div>

<style>
  #debug-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0a0a0f;
    border-top: 1px solid #222;
    font-family: monospace;
    font-size: 0.75rem;
    z-index: 100;
  }
  #debug-header {
    display: flex;
    align-items: center;
    padding: 4px 12px;
    border-bottom: 1px solid #1a1a24;
    color: #777;
  }
  #debug-log {
    max-height: 120px;
    overflow-y: auto;
    padding: 4px 0;
  }
  #debug-log .dline {
    padding: 1px 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #debug-log .dline.warn  { color: #c8a227; }
  #debug-log .dline.error { color: #e94560; }
  #debug-log .dline.info  { color: #557; }
  #debug-log .dtime { color: #444; margin-right: 6px; }
</style>

<script>
  var debugVisible = true;
  var debugMsgCount = 0;

  function debugLog(level, msg) {
    debugMsgCount++;
    var log = document.getElementById('debug-log');
    var count = document.getElementById('debug-count');
    if (!log) return;
    var line = document.createElement('div');
    line.className = 'dline ' + level;
    var now = new Date();
    var ts = now.toTimeString().slice(0, 8);
    line.innerHTML = '<span class="dtime">' + ts + '</span>' + escHtml(String(msg));
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
    if (count) count.textContent = debugMsgCount + (debugMsgCount === 1 ? ' message' : ' messages');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function debugClear() {
    var log = document.getElementById('debug-log');
    if (log) log.innerHTML = '';
    debugMsgCount = 0;
    var count = document.getElementById('debug-count');
    if (count) count.textContent = 'no messages';
  }

  function debugToggle() {
    var log = document.getElementById('debug-log');
    var btn = document.getElementById('debug-toggle');
    debugVisible = !debugVisible;
    if (log) log.style.display = debugVisible ? '' : 'none';
    if (btn) btn.textContent = debugVisible ? 'Hide' : 'Show';
  }
</script>
{% endblock %}
