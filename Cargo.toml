[package]
name = "mytv"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }
tower-http = { version = "0.5", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
askama = "0.12"
base64 = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"], default-features = false }
futures-util = { version = "0.3", default-features = false }
m3u8-rs = "6"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
criterion = "0.5"

[[bench]]
name = "hot_paths"
harness = false
# Excluded from `cargo test` so CI doesn't compile or smoke-run benches.
test = false
